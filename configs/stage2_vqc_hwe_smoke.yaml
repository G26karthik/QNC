# Smoke test for the new hardware_efficient ansatz (models.py, added this
# session): 10 epochs only, to confirm the circuit executes correctly and
# passes the SPEC §4.1/§9 physics assertions (Hermitian, Tr=1, PSD) before
# committing to a long run.

experiment: stage2_vqc_hwe_smoke
seed: 0

data:
  dataset: mnist
  classes: [0, 1, 2]
  samples_per_class: 150
  test_fraction: 0.2
  pca_components: 6

model:
  type: vqc
  n_qubits: 6
  layers: 6                    # 6*6*2=72 params, matches strongly_entangling L4,n6's 72
  ansatz: hardware_efficient
  reupload: true
  entangling: true
  beta0: 5.0
  beta_learnable: true
  beta_max: 50.0

train:
  optimizer: adam
  lr: 0.05
  lr_schedule: constant
  weight_decay: 0.0
  epochs: 10
  batch_size: 360
  tpt_multiple: 5
  shots: null

logging:
  log_interval_dense: 1
  dense_until: 50
  log_interval_sparse: 5
  checkpoint: false

metrics:
  bipartition: first_half
  compute_on: [train]
