# Stage 2 knob attempt: problem-difficulty (PLAYBOOK Stage 2 knob #4).
# stage2_vqc_base (digits 0,1,2) capped at ~88-92% train acc across 4 attempts
# (samples/class, L, lr-schedule all ruled out -- see stage2_vqc_base.yaml
# comments). This config swaps the digit triplet to 0,1,7 -- more linearly
# separable than 0,1,2 -- keeping every other knob identical, to isolate
# problem difficulty as the bottleneck.

experiment: stage2_vqc_017
seed: 0

data:
  dataset: mnist
  classes: [0, 1, 7]          # C = 3  -> etf_target = -0.5
  samples_per_class: 150
  test_fraction: 0.2
  pca_components: 6            # must equal model.n_qubits

model:
  type: vqc
  n_qubits: 6
  layers: 4
  reupload: true
  entangling: true
  beta0: 5.0
  beta_learnable: true
  beta_max: 50.0

train:
  optimizer: adam
  lr: 0.05
  lr_schedule: constant
  weight_decay: 0.0
  epochs: 400
  batch_size: 32
  tpt_multiple: 5
  shots: null

logging:
  log_interval_dense: 1
  dense_until: 50
  log_interval_sparse: 5
  checkpoint: true

metrics:
  bipartition: first_half
  compute_on: [train, test]
