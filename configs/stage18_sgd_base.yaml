# Stage 18 arm B1 base config -- PREDICTIONS.md "Stage 18 preregistration",
# arm B1 (optimizer generality: SGD momentum=0.9). n=4, L=8, R0,
# reupload=false -- the exact-invariance anchor used throughout
# HR2/HR6/HN1/HN5, chosen here so the total_var machine-precision claim is
# falsifiable under a different optimizer. train.lr is a placeholder
# overridden by the lr-pick sweep; train.seed by the campaign sweep.

experiment: stage18_sgd
seed: 0

data:
  dataset: blobs3
  blob_dist: 3.0
  blob_std: 0.8
  samples_per_class: 60
  test_fraction: 0.2

model:
  type: vqc
  n_qubits: 4
  layers: 8
  readout_family: R0
  reupload: false
  entangling: true
  encoding: angle
  beta0: 5.0
  beta_learnable: true
  beta_max: 50.0

train:
  optimizer: sgd
  momentum: 0.9
  lr: 0.05                    # placeholder; overridden by the lr-pick sweep
  lr_schedule: constant
  loss: ce
  weight_decay: 0.0
  epochs: 600
  batch_size: 32
  tpt_multiple: 5
  shots: null

logging:
  log_interval_dense: 1
  dense_until: 50
  log_interval_sparse: 5
  checkpoint: true

metrics:
  bipartition: first_half
  compute_on: [train, test]
