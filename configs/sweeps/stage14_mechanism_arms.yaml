# Stage 14 mechanism-arm sweep -- PREDICTIONS.md "Stage 14 preregistration"
# section, arms 1/3/6 (5 seeds each = 15 runs). Each variant overrides
# exactly one knob relative to configs/stage14_mechanism_base.yaml's L=8 R0
# defaults, mirroring the L=8 R0 baseline used for Mann-Whitney comparison
# (that baseline is NOT rerun here -- see PREDICTIONS.md's "Baseline" note;
# it is reused from results/sweeps/stage13_expressivity_20260714-111146/).

name: stage14_mechanism_arms
base_config: configs/stage14_mechanism_base.yaml
seeds: [0, 1, 2, 3, 4]
xlabel: mechanism arm

variants:
  - label: beta_max500
    overrides: {model.beta_max: 500}
  - label: label_smoothing
    overrides: {train.label_smoothing: 0.1}
  - label: frozen_beta
    overrides: {model.beta_learnable: false, model.beta0: 5.0}
