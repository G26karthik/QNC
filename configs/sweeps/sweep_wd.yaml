# Stage 4 weight-decay sweep: L2 penalty on variational angles = 0, 1e-4, 1e-3.
# Base = stage2_vqc_base, C=3, n=6, L=4.

name: sweep_wd
base_config: configs/stage2_vqc_base.yaml
seeds: [0, 1, 2]
xlabel: weight_decay

variants:
  - label: wd0
    overrides: {}
    value: 0.0
  - label: wd1e-4
    overrides: {train.weight_decay: 0.0001}
    value: 0.0001
  - label: wd1e-3
    overrides: {train.weight_decay: 0.001}
    value: 0.001
