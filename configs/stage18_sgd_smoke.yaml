# Smoke test for the new optimizer=sgd branch (train.py train_vqc, added
# this session for PREDICTIONS.md "Stage 18 preregistration" arm B1): 10
# epochs only, to confirm SGD+momentum actually trains (loss decreases,
# momentum key read correctly) before committing to the lr-pick + 5-seed
# campaign. n=4, L=8, R0, reupload=false (Stage 18 B1's chosen anchor --
# the exact-invariance config, see PREDICTIONS.md).

experiment: stage18_sgd_smoke
seed: 0

data:
  dataset: blobs3
  blob_dist: 3.0
  blob_std: 0.8
  samples_per_class: 60
  test_fraction: 0.2

model:
  type: vqc
  n_qubits: 4
  layers: 8
  readout_family: R0
  reupload: false
  entangling: true
  encoding: angle
  beta0: 5.0
  beta_learnable: true
  beta_max: 50.0

train:
  optimizer: sgd
  momentum: 0.9
  lr: 0.05
  lr_schedule: constant
  loss: ce
  weight_decay: 0.0
  epochs: 10
  batch_size: 32
  tpt_multiple: 5
  shots: null

logging:
  log_interval_dense: 1
  dense_until: 50
  log_interval_sparse: 5
  checkpoint: false

metrics:
  bipartition: first_half
  compute_on: [train]
