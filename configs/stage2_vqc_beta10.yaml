# Stage 2 knob attempt: beta_0 (PLAYBOOK Stage 2 knob #1, "most underrated").
# Isolated against stage2_vqc_base (digits 0,1,2, samples 150, lr 0.05, all
# else identical). Prior results this session: digit triplet -> 93.06% (no
# TPT), lr=0.1 -> 85.56% (worse, oscillating loss -- reverted to lr=0.05
# here). Trying beta0=10 (base uses 5.0) for stronger early collapse
# pressure on cross-entropy logits.

experiment: stage2_vqc_beta10
seed: 0

data:
  dataset: mnist
  classes: [0, 1, 2]          # C = 3  -> etf_target = -0.5
  samples_per_class: 150
  test_fraction: 0.2
  pca_components: 6            # must equal model.n_qubits

model:
  type: vqc
  n_qubits: 6
  layers: 4
  reupload: true
  entangling: true
  beta0: 10.0
  beta_learnable: true
  beta_max: 50.0

train:
  optimizer: adam
  lr: 0.05
  lr_schedule: constant
  weight_decay: 0.0
  epochs: 400
  batch_size: 32
  tpt_multiple: 5
  shots: null

logging:
  log_interval_dense: 1
  dense_until: 50
  log_interval_sparse: 5
  checkpoint: true

metrics:
  bipartition: first_half
  compute_on: [train, test]
