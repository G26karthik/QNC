# Stage 15 n=6 replication -- SPEC3_ADDENDUM.md section 21 / PLAYBOOK3.md
# Stage 15, upgraded with the confirmed rotation-mechanism arms (HR1-HR4,
# STAGE14B_FINDINGS.md): both reupload=true and reupload=false are run.
# blobs3 lifted to R^6 (same center-distance 3.0 / blob_std 0.8 / 60
# samples/class recipe as the n=4 headline experiment, configs/stage9_transition.yaml).
# n=6 qubits, Hilbert dim 64, su(64) dim = 4095. model.layers and
# model.reupload are placeholders overridden per-variant by the depth-probe
# sweep (M = 18L per SPEC3 section 21, since params/layer = n_qubits*3 = 18).

experiment: stage15_n6
seed: 0

data:
  dataset: blobs3
  blob_dist: 3.0
  blob_std: 0.8
  samples_per_class: 60
  test_fraction: 0.2
  ambient_dim: 6

model:
  type: vqc
  n_qubits: 6
  layers: 8                    # placeholder; overridden by the depth-probe sweep
  reupload: true                # placeholder; overridden by the depth-probe sweep
  entangling: true
  encoding: angle
  beta0: 5.0
  beta_learnable: true
  beta_max: 50.0

train:
  optimizer: adam
  lr: 0.05
  lr_schedule: constant
  loss: ce
  weight_decay: 0.0
  epochs: 600
  batch_size: 32
  tpt_multiple: 5
  shots: null

logging:
  log_interval_dense: 1
  dense_until: 50
  log_interval_sparse: 5
  checkpoint: true

metrics:
  bipartition: first_half
  compute_on: [train, test]
